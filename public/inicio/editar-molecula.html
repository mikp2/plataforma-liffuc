<!DOCTYPE html>
<html lang="es" data-i18n-title="Editar molécula | LIFFUC-DB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar molécula | LIFFUC-DB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--forest:#183c30;--forest-light:#245641;--paper:#f7f5ed;--white:#fff;--ink:#26352e;--muted:#78837b;--line:#e4e8df;--danger:#a3443a;font-family:"DM Sans",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper)}button,input,select,textarea{font:inherit}a{color:inherit;text-decoration:none}
    .page{max-width:1100px;margin:auto;padding:34px clamp(18px,4vw,48px) 54px}
    .language-selector{position:fixed;top:16px;right:16px;z-index:20;display:flex;min-height:38px;align-items:center;gap:7px;padding:0 10px;color:var(--forest);background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:0 4px 14px #183c3012;font-size:12px;font-weight:600}
    .language-selector select{max-width:min(34vw,130px);min-height:34px;padding:0 18px 0 0;color:inherit;background:transparent;border:0;font:inherit}
    .header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:12px 0 25px}.header p{margin:0 0 7px;color:var(--muted);font-size:12px}.header h1{margin:0;color:var(--forest);font:500 clamp(26px,3vw,34px) "Fraunces",serif}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 15px;color:var(--white);background:var(--forest-light);border:1px solid var(--forest-light);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
    .btn.secondary{color:var(--forest);background:var(--white);border-color:var(--line)}.btn:hover{filter:brightness(.96)}.btn:disabled{opacity:.65;cursor:wait}
    .message{margin-bottom:16px;padding:12px 15px;color:var(--forest);background:#e9f1e8;border:1px solid #d5e4d3;border-radius:9px;font-size:13px}.message[hidden]{display:none}.message[data-kind=error]{color:var(--danger);background:#fbefed;border-color:#ebd0cb}
    .card{margin-bottom:17px;padding:22px;background:var(--white);border:1px solid var(--line);border-radius:12px}.card h2{margin:0 0 17px;color:var(--forest);font:500 20px "Fraunces",serif}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
    .field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{color:#48564d;font-size:12px;font-weight:600}.field input,.field select,.field textarea{width:100%;min-height:41px;padding:10px 11px;color:var(--ink);background:#fbfcf9;border:1px solid var(--line);border-radius:8px;outline:none}.field textarea{min-height:100px;resize:vertical;line-height:1.55}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8ca992;box-shadow:0 0 0 3px #8ca99226}.help{color:var(--muted);font-size:11px}
    .upload-box{display:grid;gap:10px;padding:16px;background:#fbfcf9;border:1px dashed #cbd6c9;border-radius:10px}.file-input{max-width:100%;color:var(--muted);font-size:12px}
    .file-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.file-card{overflow:hidden;background:var(--white);border:1px solid var(--line);border-radius:9px}.file-preview{display:grid;height:135px;place-items:center;background:#f3f5f0;color:var(--muted);font-size:13px}.file-preview img{width:100%;height:100%;object-fit:cover}.file-info{display:grid;gap:8px;padding:11px}.file-name{overflow:hidden;font-size:11px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.file-actions{display:flex;justify-content:space-between;gap:8px;align-items:center}.file-actions a{color:var(--forest-light);font-size:11px;font-weight:600}.remove-file{padding:5px 8px;color:var(--danger);background:white;border:1px solid #edd8d4;border-radius:6px;font-size:11px}
    .footer-actions{display:flex;justify-content:flex-end;gap:10px;padding-top:5px}.loading{padding:30px;text-align:center;color:var(--muted)}
    @media(max-width:650px){.page{padding-top:76px}.language-selector{top:14px;right:12px;min-height:36px}.language-selector>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap}.header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:17px}.footer-actions{flex-direction:column-reverse}.footer-actions .btn{width:100%}}
  </style>
</head>
<body>
  <label class="language-selector">
    <span data-i18n="Idioma">Idioma</span>
    <select data-language-selector aria-label="Idioma" data-i18n-aria-label="Idioma">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="pt">Português</option>
      <option value="it">Italiano</option>
    </select>
  </label>
  <main class="page">
    <header class="header">
      <div>
        <p><a href="/panel/moleculas"><span data-i18n="← Catálogo / ">← Catálogo / </span></a><span id="breadcrumb" data-i18n="Nueva molécula">Nueva molécula</span></p>
        <h1 id="page-title" data-i18n="Registrar molécula">Registrar molécula</h1>
      </div>
      <a class="btn secondary" href="/panel/moleculas" data-i18n="Volver al catálogo">Volver al catálogo</a>
    </header>
    <div class="message" id="message" role="status" aria-live="polite" hidden></div>
    <form id="molecule-form">
      <section class="card">
        <h2 data-i18n="Identificación">Identificación</h2>
        <div class="grid">
          <div class="field"><label for="codigo" data-i18n="Código *">Código *</label><input id="codigo" name="codigo" maxlength="40" required autocomplete="off"></div>
          <div class="field"><label for="nombre" data-i18n="Nombre del compuesto *">Nombre del compuesto *</label><input id="nombre" name="nombre" maxlength="180" required></div>
          <div class="field"><label for="formula" data-i18n="Fórmula molecular">Fórmula molecular</label><input id="formula" name="formula" maxlength="120" placeholder="Ej. C15H24O" data-i18n-placeholder="Ej. C15H24O"></div>
          <div class="field"><label for="pesoMolecular" data-i18n="Peso molecular (g/mol)">Peso molecular (g/mol)</label><input id="pesoMolecular" name="pesoMolecular" type="number" min="0" step="any" placeholder="Ej. 220.36" data-i18n-placeholder="Ej. 220.36"></div>
          <div class="field"><label for="especie" data-i18n="Especie *">Especie *</label><input id="especie" name="especie" maxlength="180" required></div>
          <div class="field"><label for="familia" data-i18n="Familia">Familia</label><input id="familia" name="familia" maxlength="180"></div>
          <div class="field"><label for="origen" data-i18n="Origen / procedencia">Origen / procedencia</label><input id="origen" name="origen" maxlength="300"></div>
          <div class="field"><label for="estado" data-i18n="Estado">Estado</label>
            <select id="estado" name="estado">
              <option value="BORRADOR" data-i18n="Borrador">Borrador</option>
              <option value="EN_REVISION" data-i18n="En revisión">En revisión</option>
              <option value="APROBADA" data-i18n="Aprobada">Aprobada</option>
              <option value="PUBLICADA" data-i18n="Publicada">Publicada</option>
            </select>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="Información científica">Información científica</h2>
        <div class="grid">
          <div class="field full"><label for="descripcion" data-i18n="Descripción *">Descripción *</label><textarea id="descripcion" name="descripcion" maxlength="10000" required></textarea></div>
          <div class="field full"><label for="actividad" data-i18n="Actividad farmacológica / biológica">Actividad farmacológica / biológica</label><textarea id="actividad" name="actividad" maxlength="10000"></textarea></div>
          <div class="field full"><label for="metodoObtencion" data-i18n="Método de obtención">Método de obtención</label><textarea id="metodoObtencion" name="metodoObtencion" maxlength="10000"></textarea></div>
          <div class="field full"><label for="referencias" data-i18n="Referencias">Referencias</label><textarea id="referencias" name="referencias" maxlength="10000"></textarea></div>
        </div>
      </section>

      <section class="card" id="attachments-card" hidden>
        <h2 data-i18n="Imágenes y documentos asociados">Imágenes y documentos asociados</h2>
        <div class="file-list" id="file-list"></div>
      </section>

      <section class="card">
        <h2 data-i18n="Adjuntar imágenes y PDF">Adjuntar imágenes y PDF</h2>
        <div class="upload-box">
          <label for="files" data-i18n="Selecciona uno o varios archivos (JPG, PNG, WEBP o PDF; hasta 10 archivos por carga).">Selecciona uno o varios archivos (JPG, PNG, WEBP o PDF; hasta 10 archivos por carga).</label>
          <input class="file-input" id="files" name="files" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple>
          <span class="help" data-i18n="Máximo 12 MB por imagen, 25 MB por PDF y 40 MB en total.">Máximo 12 MB por imagen, 25 MB por PDF y 40 MB en total.</span>
        </div>
      </section>
      <div class="footer-actions">
        <a class="btn secondary" href="/panel/moleculas" data-i18n="Cancelar">Cancelar</a>
        <button class="btn" id="save" type="submit" data-i18n="Guardar molécula">Guardar molécula</button>
      </div>
    </form>
  </main>
  <script src="/inicio/i18n.js" defer></script>
  <script src="/inicio/editar-molecula.js" defer></script>
</body>
</html>
