<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moléculas | LIFFUC-DB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--forest:#183c30;--forest-light:#245641;--gold:#c49a46;--paper:#f7f5ed;--white:#fff;--ink:#26352e;--muted:#78837b;--line:#e4e8df;--danger:#a3443a;font-family:"DM Sans",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper)}button,input,select{font:inherit}a{color:inherit;text-decoration:none}
    .page{max-width:1440px;margin:auto;padding:34px clamp(18px,4vw,54px) 48px}
    .header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:12px 0 28px}
    .eyebrow{margin:0 0 7px;color:var(--muted);font-size:12px}.header h1{margin:0;color:var(--forest);font:500 clamp(28px,3vw,36px) "Fraunces",serif}.header p:last-child{margin:7px 0 0;color:var(--muted);font-size:13px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 15px;color:var(--white);background:var(--forest-light);border:1px solid var(--forest-light);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
    .btn:hover{background:var(--forest)}.btn.secondary{color:var(--forest);background:var(--white);border-color:var(--line)}
    .message{margin-bottom:16px;padding:12px 15px;color:var(--forest);background:#e9f1e8;border:1px solid #d5e4d3;border-radius:9px;font-size:13px}.message[hidden]{display:none}.message[data-kind=error]{color:var(--danger);background:#fbefed;border-color:#ebd0cb}
    .filters{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(140px,1fr)) auto;gap:10px;padding:16px;background:var(--white);border:1px solid var(--line);border-radius:12px 12px 0 0}
    .field{min-height:40px;width:100%;padding:0 11px;color:var(--ink);background:#fbfcf9;border:1px solid var(--line);border-radius:8px;outline:none}
    .field:focus{border-color:#8ca992;box-shadow:0 0 0 3px #8ca99226}
    .results{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 17px;color:var(--muted);background:#fbfcf9;border:1px solid var(--line);border-top:0;font-size:12px}
    .table-wrap{overflow:auto;background:var(--white);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px}
    table{width:100%;border-collapse:collapse;text-align:left}th{padding:12px 15px;color:var(--muted);background:#fafbf8;font-size:10px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}td{padding:14px 15px;border-top:1px solid #edf0ea;font-size:12px}
    tbody tr:hover{background:#fbfcf9}.code{color:var(--forest-light);font-family:monospace;font-size:11px}.name{font-weight:600}.sub{display:block;margin-top:3px;color:var(--muted);font-size:11px}
    .status{display:inline-block;padding:4px 9px;color:#526b58;background:#edf3eb;border-radius:999px;font-size:10px;white-space:nowrap}.status[data-state=EN_REVISION]{color:#755b20;background:#f8f0db}.status[data-state=BORRADOR]{color:#69736c;background:#eef0ed}.status[data-state=PUBLICADA]{color:#315d84;background:#e8f1fa}
    .edit-link{color:var(--forest-light);font-weight:700}.edit-link:hover{text-decoration:underline}.empty{text-align:center;padding:38px;color:var(--muted)}.empty strong{display:block;margin-bottom:6px;color:var(--ink)}
    @media(max-width:900px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .search{grid-column:span 2}}
    @media(max-width:600px){.page{padding-top:76px}.header{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr}.filters .search{grid-column:auto}.results{align-items:flex-start;flex-direction:column}.table-wrap{border-radius:0 0 10px 10px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <p class="eyebrow">LIFFUC-DB / Catálogo</p>
        <h1>Moléculas</h1>
        <p>Busca, filtra y administra los registros del banco.</p>
      </div>
      <div class="actions">
        <button class="btn secondary" id="refresh" type="button">Actualizar</button>
        <a class="btn" href="/panel/moleculas/nueva">+ Nueva molécula</a>
      </div>
    </header>

    <div class="message" id="message" role="status" aria-live="polite" hidden></div>
    <section aria-label="Filtros de moléculas">
      <div class="filters">
        <input class="field search" id="search" type="search" placeholder="Buscar código, molécula, fórmula o especie…" aria-label="Buscar moléculas">
        <select class="field" id="state-filter" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
          <option value="BORRADOR">Borrador</option>
          <option value="EN_REVISION">En revisión</option>
          <option value="APROBADA">Aprobada</option>
          <option value="PUBLICADA">Publicada</option>
        </select>
        <select class="field" id="species-filter" aria-label="Filtrar por especie">
          <option value="">Todas las especies</option>
        </select>
        <select class="field" id="sort" aria-label="Ordenar moléculas">
          <option value="updated-desc">Más recientes</option>
          <option value="name-asc">Nombre A–Z</option>
          <option value="name-desc">Nombre Z–A</option>
          <option value="code-asc">Código A–Z</option>
          <option value="weight-asc">Peso molecular ↑</option>
          <option value="weight-desc">Peso molecular ↓</option>
        </select>
        <button class="btn secondary" id="clear" type="button">Limpiar</button>
      </div>
      <div class="results">
        <span id="result-count">Cargando catálogo…</span>
        <span id="demo-notice" hidden>Los códigos LFC-DEMO son datos ficticios de prueba.</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Código</th><th scope="col">Molécula</th><th scope="col">Fórmula</th>
              <th scope="col">Especie</th><th scope="col">Peso molecular</th><th scope="col">Estado</th><th scope="col">Actualizado</th><th scope="col">Acción</th>
            </tr>
          </thead>
          <tbody id="molecule-rows"><tr><td class="empty" colspan="8">Cargando moléculas…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/inicio/moleculas.js" defer></script>
</body>
</html>
