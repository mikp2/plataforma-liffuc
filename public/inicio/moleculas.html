<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <title>Moléculas | LIFFUC-DB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/inicio/moleculas.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div>
        <p class="eyebrow"><a href="/inicio/DB.html">LIFFUC-DB</a><span aria-hidden="true">/</span> Catálogo</p>
        <h1>Moléculas</h1>
        <p class="page-description">Explora y administra los compuestos registrados en el banco.</p>
      </div>
      <div class="header-actions">
        <button class="button button--quiet" id="refresh" type="button" aria-label="Actualizar catálogo">
          <span aria-hidden="true">↻</span> Actualizar
        </button>
        <a class="button button--primary" href="/panel/moleculas/nueva">
          <span aria-hidden="true">＋</span> Nueva molécula
        </a>
      </div>
    </header>

    <div class="message" id="message" role="status" aria-live="polite" hidden></div>

    <section class="catalog" aria-label="Catálogo de moléculas">
      <div class="catalog-toolbar">
        <label class="search-field">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Buscar por nombre, código, fórmula o especie…" aria-label="Buscar moléculas">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <div class="filters">
          <label class="filter-control">
            <span class="visually-hidden">Filtrar por estado</span>
            <select id="state-filter" aria-label="Filtrar por estado">
              <option value="">Todos los estados</option>
              <option value="BORRADOR">Borrador</option>
              <option value="EN_REVISION">En revisión</option>
              <option value="APROBADA">Aprobada</option>
              <option value="PUBLICADA">Publicada</option>
            </select>
          </label>
          <label class="filter-control">
            <span class="visually-hidden">Filtrar por especie</span>
            <select id="species-filter" aria-label="Filtrar por especie">
              <option value="">Todas las especies</option>
            </select>
          </label>
          <label class="filter-control">
            <span class="visually-hidden">Ordenar moléculas</span>
            <select id="sort" aria-label="Ordenar moléculas">
              <option value="updated-desc">Más recientes</option>
              <option value="name-asc">Nombre A–Z</option>
              <option value="name-desc">Nombre Z–A</option>
              <option value="code-asc">Código A–Z</option>
              <option value="weight-asc">Peso molecular ↑</option>
              <option value="weight-desc">Peso molecular ↓</option>
            </select>
          </label>
          <button class="button button--text" id="clear" type="button">Limpiar</button>
        </div>
      </div>

      <div class="catalog-meta">
        <p id="result-count" aria-live="polite">Cargando catálogo…</p>
        <span class="demo-note" id="demo-notice" hidden>Incluye registros identificados como datos de prueba.</span>
      </div>

      <div class="molecule-grid" id="molecule-rows" aria-live="polite" aria-busy="true">
        <div class="empty-state"><span class="loading-mark" aria-hidden="true"></span><strong>Cargando moléculas</strong></div>
      </div>
    </section>
  </main>

  <dialog class="detail-dialog" id="molecule-detail" aria-labelledby="detail-title">
    <div class="detail-header">
      <div>
        <p class="eyebrow" id="detail-code"></p>
        <h2 id="detail-title">Ficha de molécula</h2>
      </div>
      <button class="icon-button" id="close-detail" type="button" aria-label="Cerrar ficha">×</button>
    </div>
    <div class="detail-content" id="detail-content"></div>
    <div class="detail-footer">
      <button class="button button--quiet" id="close-detail-footer" type="button">Cerrar</button>
      <a class="button button--primary" id="detail-edit" href="#">Editar molécula</a>
    </div>
  </dialog>

  <script src="/inicio/moleculas.js" defer></script>
</body>
</html>
